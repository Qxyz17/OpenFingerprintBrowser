name: proxifier

on:
  push:
    paths:
      - "proxifier/**"
      - ".github/workflows/proxifier.yml"
  pull_request:
    paths:
      - "proxifier/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WinDivert SDK
        shell: pwsh
        run: |
          $ver = "2.2.2"
          $url = "https://reqrypt.org/download/WinDivert-$ver.zip"
          $dst = "${{ github.workspace }}\proxifier\third_party\windivert"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\wd.zip"
          Expand-Archive -Path "$env:TEMP\wd.zip" -DestinationPath $dst -Force
          Get-ChildItem $dst -Recurse -Filter WinDivert.lib | Select-Object FullName

      - name: Configure
        shell: pwsh
        run: |
          cmake -S proxifier -B proxifier/build `
            -G "Visual Studio 17 2022" -A x64 `
            -DWINDIVERT_DIR="${{ github.workspace }}\proxifier\third_party\windivert"

      - name: Build
        shell: pwsh
        run: cmake --build proxifier/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: proxifier-x64
          path: proxifier/build/Release/proxifier.exe
